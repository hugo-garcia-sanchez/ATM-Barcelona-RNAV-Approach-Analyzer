name: Build Release Executables

on:
  push:
    branches: [ release ]

jobs:
  # ── 1. Shared build date ────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

  # ── 2. Build Linux ──────────────────────────────────────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installs
        run: |
          python -c "import uvicorn;    print('uvicorn    OK')"
          python -c "import multipart;  print('multipart  OK')"
          python -c "import fastapi;    print('fastapi    OK')"
          python -c "import websockets; print('websockets OK')"
          python -c "import pandas;     print('pandas     OK')"
          python -c "import webview;    print('webview    OK')"

      - name: Build executable
        run: pyinstaller pyinstaller/linux.spec

      - name: Rename binary
        run: mv dist/ATM_analyzer dist/ATM_analyzer_linux_${{ needs.prepare.outputs.date }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary_linux
          path: dist/ATM_analyzer_linux_${{ needs.prepare.outputs.date }}
          retention-days: 1

  # ── 3. Build Windows ────────────────────────────────────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installs
        shell: pwsh
        run: |
          python -c "import uvicorn;    print('uvicorn    OK')"
          python -c "import multipart;  print('multipart  OK')"
          python -c "import fastapi;    print('fastapi    OK')"
          python -c "import websockets; print('websockets OK')"
          python -c "import pandas;     print('pandas     OK')"
          python -c "import webview;    print('webview    OK')"

      - name: Build executable
        shell: pwsh
        run: pyinstaller pyinstaller/windows.spec

      - name: Rename binary
        shell: bash
        run: mv dist/ATM_analyzer.exe "dist/ATM_analyzer_windows_${{ needs.prepare.outputs.date }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: binary_windows
          path: dist/ATM_analyzer_windows_${{ needs.prepare.outputs.date }}.exe
          retention-days: 1

  # ── 4. Create permanent GitHub Release ─────────────────────────────────────
  release:
    needs: [ prepare, build-linux, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary_linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: binary_windows
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ needs.prepare.outputs.date }}
          name: "ATM Analyzer — ${{ needs.prepare.outputs.date }}"
          body: |
            Automated build from the `release` branch.

            **Downloads**
            - `ATM_analyzer_linux_*` — Linux (`chmod +x` then run)
            - `ATM_analyzer_windows_*.exe` — Windows (double-click + more information)
          draft: false
          prerelease: false
          files: dist/*
          make_latest: true